server:
  port: 8081

spring:
  application:
    name: loan-application-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/loan_service_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Gowshika@93
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        json:
          add:
            type:
              headers: false

auth:
  public-key-url: http://localhost:8080/api/auth/public-key

customer:
  service-url: http://localhost:8082/api/customers

notification:
  service-url: http://localhost:8090/api/notifications/send

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

kafka:
  bootstrap-servers: localhost:9092
  topics:
    loan-approved: loan.approved.topic
    loan-payment: loan.payment.topic

management:
  tracing:
    enabled: false

logging:
  level:
    root: INFO
    com.bank.loan: DEBUG
